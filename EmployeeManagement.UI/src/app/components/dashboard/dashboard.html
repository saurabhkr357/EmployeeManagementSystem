<div class="dashboard">

  <h1>Dashboard</h1>

  <div class="cards">

    <div class="card">
      <h3>Total Employees</h3>
      <p>{{ totalEmployees() }}</p>
    </div>

    <div class="card">
      <h3>Total Payroll</h3>
      <p>₹ {{ totalPayroll() }}</p>
    </div>

    <div class="card">
      <h3>Present Today</h3>
      <p>{{ presentToday() }}</p>
    </div>

    <div class="card">
      <h3>Absent Today</h3>
      <p>{{ absentToday() }}</p>
    </div>

  </div>

</div>
