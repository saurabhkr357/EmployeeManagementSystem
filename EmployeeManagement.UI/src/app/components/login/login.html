<div class="login-container">

  <div class="login-card">

    <div class="login-header">

      <div class="logo">
        EMS
      </div>

      <h2>Employee Management System</h2>

      <p>Sign in to your account</p>

    </div>

    <form (ngSubmit)="login()">

      <div class="form-group">

        <label for="username">
          Username
        </label>

        <input
          id="username"
          type="text"
          [(ngModel)]="username"
          name="username"
          placeholder="Enter your username"
          required>

      </div>

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter your password"
          required>

      </div>

      <button
        type="submit"
        class="login-button">

        Login

      </button>

      @if (errorMessage) {

        <p class="error">
          {{ errorMessage }}
        </p>

      }

    </form>

    <div class="login-footer">
      Employee Management System
    </div>

  </div>

</div>
